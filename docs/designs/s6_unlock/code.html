  </head><body class="min-h-full bg-surface text-on-surface font-body-md text-body-md antialiased"><main class="min-h-full flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full px-gutter pb-6 pt-2 select-none justify-between items-center max-w-[420px] mx-auto min-h-[720px]">

</div>
<!-- Monogram & Logo Crest -->

<path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 4C16.41 4 20 7.59 20 12C20 14.15 19.16 16.11 17.78 17.57C17.06 15.35 14.88 13.78 12 13.78C9.12 13.78 6.94 15.35 6.22 17.57C4.84 16.11 4 14.15 4 12C4 7.59 7.59 4 12 4ZM12 7C10.62 7 9.5 8.12 9.5 9.5C9.5 10.88 10.62 12 12 12C13.38 12 14.5 10.88 14.5 9.5C14.5 8.12 13.38 7 12 7Z" fill="currentColor" fill-opacity="0.9"></path>
<circle cx="12" cy="9.5" fill="#FAF8F4" r="1.5"></circle>
</svg>
<span class="absolute -bottom-0.5 -right-0.5 flex h-3.5 w-3.5 items-center justify-center rounded-full bg-surface-container-lowest shadow-sm">
<span class="h-2 w-2 rounded-full bg-secondary"></span>
</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-primary tracking-tight">LifeNest</h2>
</div>
<!-- Greeting & Reassurance -->
<div class="text-center px-4">
<h1 class="font-headline-lg text-headline-lg text-primary mb-1">Welcome back, Lerato</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your 6-digit PIN to access your family vault.</p>
</div>
<!-- Dynamic Warning Banner (Interactively dismissible / triggers on max attempts) -->
<div class="w-full mt-3 px-3 py-2 rounded-xl bg-error-container text-on-error-container flex items-center justify-between shadow-sm transition-all duration-300" id="lockout-banner">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">lock_clock</span>
<span class="font-label-md text-label-md">3 attempts remaining before lockout</span>
</div>
<button class="font-label-md text-label-md font-semibold underline active:opacity-75" id="banner-action-btn">Log in</button>
</div>
<!-- PIN Digit Indicator Beads (6-digit format) -->
<div class="flex items-center justify-center gap-3.5 mt-5 mb-2" id="pin-dots-group">
<!-- Dot 1: Active Filled -->
<div class="pin-dot w-3.5 h-3.5 rounded-full bg-primary-container shadow-sm transform transition-all duration-200"></div>
<!-- Dot 2: Active Filled -->
<div class="pin-dot w-3.5 h-3.5 rounded-full bg-primary-container shadow-sm transform transition-all duration-200"></div>
<!-- Dot 3: Active Filled -->
<div class="pin-dot w-3.5 h-3.5 rounded-full bg-primary-container shadow-sm transform transition-all duration-200"></div>
<!-- Dot 4: Active Filled with Warm Gold Core -->
<div class="pin-dot w-3.5 h-3.5 rounded-full bg-secondary shadow-sm transform scale-110 transition-all duration-200"></div>
<!-- Dot 5: Empty Slot -->
<div class="pin-dot w-3.5 h-3.5 rounded-full bg-surface-container-high transition-all duration-200"></div>
<!-- Dot 6: Empty Slot -->
<div class="pin-dot w-3.5 h-3.5 rounded-full bg-surface-container-high transition-all duration-200"></div>
</div>
</div>
<!-- Numeric Touchpad Matrix: Ergonomic one-hand geometry -->
<div class="w-full max-w-[320px] my-auto">
<div class="grid grid-cols-3 gap-y-3.5 gap-x-5 place-items-center">
<!-- Key 1 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">1</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-60 font-medium"></span>
</button>
<!-- Key 2 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">2</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-80 font-medium">ABC</span>
</button>
<!-- Key 3 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">3</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-80 font-medium">DEF</span>
</button>
<!-- Key 4 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">4</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-80 font-medium">GHI</span>
</button>
<!-- Key 5 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">5</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-80 font-medium">JKL</span>
</button>
<!-- Key 6 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">6</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-80 font-medium">MNO</span>
</button>
<!-- Key 7 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">7</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-80 font-medium">PQRS</span>
</button>
<!-- Key 8 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">8</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-80 font-medium">TUV</span>
</button>
<!-- Key 9 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">9</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-80 font-medium">WXYZ</span>
</button>
<!-- Biometric Trigger (Touch ID / Face) -->
<button aria-label="Use Biometrics" class="w-[70px] h-[70px] rounded-full bg-surface-container-low text-secondary flex flex-col items-center justify-center active:bg-secondary-container active:scale-95 transition-all duration-150 shadow-sm group" id="biometric-btn" type="button">
<span class="material-symbols-outlined text-[26px] group-hover:scale-105 transition-transform" style="font-variation-settings: 'FILL' 0, 'wght' 350;">fingerprint</span>
<span class="font-label-sm text-[9px] text-secondary tracking-tight font-medium mt-0.5">Biometric</span>
</button>
<!-- Key 0 -->
<button class="num-key w-[70px] h-[70px] rounded-full bg-surface-container-lowest text-primary flex flex-col items-center justify-center shadow-sm active:bg-surface-container-high active:scale-95 transition-all duration-150" type="button">
<span class="font-title-md text-headline-sm font-semibold leading-none">0</span>
<span class="font-label-sm text-[10px] text-on-surface-variant tracking-widest mt-0.5 opacity-60 font-medium">+</span>
</button>
<!-- Delete / Backspace Key -->
<button aria-label="Delete last digit" class="w-[70px] h-[70px] rounded-full bg-surface-container-low text-primary flex items-center justify-center active:bg-surface-container-high active:scale-95 transition-all duration-150 shadow-sm" id="backspace-btn" type="button">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</button>
</div>
</div>
<!-- Bottom Actions & Security Metadata -->
<div class="flex flex-col items-center w-full gap-3 pt-3">
<!-- Forgot PIN Link -->
<button class="px-4 py-1.5 rounded-full font-label-lg text-label-lg text-secondary font-medium tracking-wide active:opacity-70 transition-opacity" type="button">
      Forgot PIN?
    </button>
<!-- Security Footnote Pill -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-[13px] text-secondary" style="font-variation-settings: 'FILL' 1;">enhanced_encryption</span>
<span class="font-label-sm text-[10px] tracking-tight text-center">AES-256 Sanctuary Encryption • Locked after 5m inactivity</span>
</div>
</div>
</div>
<script>
  (function() {
    let pin = '1234';
    const maxDigits = 6;
    const dots = document.querySelectorAll('.pin-dot');
    const banner = document.getElementById('lockout-banner');
    const biometricBtn = document.getElementById('biometric-btn');
    const backspaceBtn = document.getElementById('backspace-btn');
    const numKeys = document.querySelectorAll('.num-key');

    function updateDots() {
      dots.forEach((dot, index) => {
        dot.className = 'pin-dot w-3.5 h-3.5 rounded-full transition-all duration-200';
        if (index < pin.length) {
          if (index === pin.length - 1) {
            dot.classList.add('bg-secondary', 'shadow-sm', 'scale-110');
          } else {
            dot.classList.add('bg-primary-container', 'shadow-sm');
          }
        } else {
          dot.classList.add('bg-surface-container-high');
        }
      });

      if (pin.length === maxDigits) {
        // Vault feedback simulation
        setTimeout(() => {
          dots.forEach(d => {
            d.classList.add('bg-secondary', 'scale-110');
          });
        }, 120);
      }
    }

    numKeys.forEach(key => {
      key.addEventListener('click', () => {
        if (pin.length < maxDigits) {
          pin += key.querySelector('span').innerText.trim();
          updateDots();
        }
      });
    });

    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', () => {
        if (pin.length > 0) {
          pin = pin.slice(0, -1);
          updateDots();
        }
      });
    }

    if (biometricBtn) {
      biometricBtn.addEventListener('click', () => {
        biometricBtn.classList.add('bg-secondary-container');
        setTimeout(() => {
          biometricBtn.classList.remove('bg-secondary-container');
          pin = '123456';
          updateDots();
        }, 300);
      });
    }

    updateDots();
  })();
</script></main></body></html>
